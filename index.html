<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات الطلاب - ثانوية الأمير عبدالمجيد</title>
    <!-- استخدام نفس إصدار مكتبة Firebase الموجود في لوحة تحكمك -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .student-card { background: white; width: 100%; max-width: 450px; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-top: 8px solid var(--maroon); text-align: center; }
        .header h2 { color: var(--maroon); margin-bottom: 5px; }
        .header p { color: #666; margin-bottom: 25px; font-size: 0.9rem; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-family: sans-serif; font-size: 1rem; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--maroon); outline: none; box-shadow: 0 0 5px rgba(128,0,0,0.2); }
        .btn-submit { width: 100%; padding: 14px; margin-top: 10px; background: var(--maroon); color: var(--gold); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .btn-submit:hover { background: #660000; }
        #message { margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        .footer { margin-top: 25px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

<div class="student-card">
    <div class="header">
        <h2>تسجيل البيانات</h2>
        <p>أ. عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد</p>
    </div>

    <div class="input-group">
        <label>الاسم الثلاثي:</label>
        <input type="text" id="studentName" placeholder="مثال: محمد أحمد علي" required>
    </div>

    <div class="input-group">
        <label>البريد الإلكتروني (منصة مدرستي):</label>
        <input type="email" id="studentEmail" placeholder="sXXXXX@rg.moe.gov.sa" required dir="ltr">
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitStudentData()">إرسال بياناتي 🚀</button>
    <div id="message"></div>
    
    <div class="footer">✨ منصة قدرات - ثانوية الأمير عبدالمجيد 🎓</div>
</div>

<script>
    // نفس بيانات الاتصال بقاعدة البيانات الخاصة بلوحتك
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function submitStudentData() {
        const btn = document.getElementById("submitBtn");
        const msg = document.getElementById("message");
        const nameInput = document.getElementById("studentName").value.trim();
        const emailInput = document.getElementById("studentEmail").value.trim().toLowerCase();

        // 1. التحقق من أن الاسم ثلاثي (يحتوي على مسافتين على الأقل)
        const nameParts = nameInput.split(/\s+/);
        if (nameParts.length < 3) {
            msg.style.color = "red";
            msg.innerText = "❌ عذراً، يجب كتابة الاسم ثلاثي على الأقل.";
            return;
        }

        // 2. التحقق من صيغة الإيميل (يبدأ بـ s وينتهي بالنطاق المطلوب)
        const emailRegex = /^s.+@rg\.moe\.gov\.sa$/;
        if (!emailRegex.test(emailInput)) {
            msg.style.color = "red";
            msg.innerText = "❌ عذراً، الإيميل غير صحيح. يجب أن يبدأ بحرف s ويكون تابع لمنصة مدرستي (مثال: s78510@rg.moe.gov.sa).";
            return;
        }

        // إيقاف الزر أثناء الإرسال لمنع التكرار
        btn.disabled = true;
        btn.innerText = "جاري الإرسال...";
        msg.innerText = "";

        try {
            // إضافة البيانات بنفس طريقة لوحتك تماماً (يستخدم الإيميل كمعرف)
            await db.collection("allowed_students").doc(emailInput).set({
                name: nameInput,
                added_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            msg.style.color = "green";
            msg.innerText = "✅ تم إرسال بياناتك بنجاح. شكراً لك!";
            
            // تفريغ الحقول بعد الإرسال
            document.getElementById("studentName").value = "";
            document.getElementById("studentEmail").value = "";
        } catch (error) {
            msg.style.color = "red";
            msg.innerText = "❌ حدث خطأ أثناء الإرسال، حاول مرة أخرى.";
            console.error("Error:", error);
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال بياناتي 🚀";
        }
    }
</script>

</body>
</html>
